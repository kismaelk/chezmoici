<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Halo Braids — Luxury Hair Braiding · Ottawa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Cinzel:wght@400;500;600&family=Great+Vibes&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body data-page="home">

<nav class="nav" id="app-nav"></nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-grid"></div>
  <div class="hero-content">
    <p class="hero-eyebrow" data-i18n="home.eyebrow"></p>
    <h1 class="hero-title" data-i18n="home.title">HALO BRAIDS</h1>
    <em class="h-script" style="display:block;font-size:clamp(2.2rem,6vw,5rem);color:var(--gold);margin-top:-.3rem;line-height:1" data-i18n="home.subtitle"></em>
    <p class="hero-tagline" data-i18n="home.tagline"></p>
    <div class="hero-ctas">
      <a href="booking.html" class="btn btn-lg" data-i18n="home.cta.book"></a>
      <a href="services.html" class="btn btn-outline btn-lg" style="border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.7)" data-i18n="home.cta.services"></a>
    </div>
  </div>
</section>

<!-- ABOUT -->
<section class="section section-light">
  <div class="section-header fade-up">
    <span class="label" data-i18n="home.about.label"></span>
    <div class="h-script" data-i18n="home.about.title"></div>
    <h2 data-i18n="home.about.subtitle"></h2>
  </div>
  <div style="max-width:800px;margin:0 auto;text-align:center" class="fade-up">
    <p style="font-family:'Cormorant Garamond',serif;font-size:1.15rem;line-height:1.9;color:var(--muted);margin-bottom:1.5rem" data-i18n="home.about.p1"></p>
    <p style="font-family:'Cormorant Garamond',serif;font-size:1.15rem;line-height:1.9;color:var(--muted)" data-i18n="home.about.p2"></p>
  </div>
</section>

<!-- SERVICES PREVIEW -->
<section class="section section-cream">
  <div class="section-header fade-up">
    <span class="label" data-i18n="home.services.label"></span>
    <div class="h-script" data-i18n="home.services.title"></div>
    <h2 data-i18n="home.services.subtitle"></h2>
  </div>

  <div class="text-center mt-3">
    <a href="services.html" class="btn btn-dark" data-i18n="home.services.viewAll"></a>
  </div>
</section>

<!-- EXPERIENCE -->
<section class="section section-dark">

    <span class="label" data-i18n="home.exp.label"></span>
    <div class="h-script" data-i18n="home.exp.title"></div>
  </div>
  <div class="grid-3" style="max-width:900px;text-align:center">

      <div style="font-family:'Cormorant Garamond',serif;font-size:4rem;color:rgba(201,169,110,.2);line-height:1">01</div>
      <div style="width:32px;height:1px;background:var(--gold);margin:.6rem auto 1rem"></div>

    </div>
    <div class="fade-up">
      <div style="font-family:'Cormorant Garamond',serif;font-size:4rem;color:rgba(201,169,110,.2);line-height:1">02</div>
      <div style="width:32px;height:1px;background:var(--gold);margin:.6rem auto 1rem"></div>
      <div style="font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.25em;color:var(--gold);margin-bottom:.6rem" data-i18n="home.exp.step2.title"></div>
      <p style="color:rgba(255,255,255,.5);font-family:'Cormorant Garamond',serif;font-size:1.05rem;line-height:1.8" data-i18n="home.exp.step2.desc"></p>
    </div>
    <div class="fade-up">
      <div style="font-family:'Cormorant Garamond',serif;font-size:4rem;color:rgba(201,169,110,.2);line-height:1">03</div>
      <div style="width:32px;height:1px;background:var(--gold);margin:.6rem auto 1rem"></div>
      <div style="font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.25em;color:var(--gold);margin-bottom:.6rem" data-i18n="home.exp.step3.title"></div>
      <p style="color:rgba(255,255,255,.5);font-family:'Cormorant Garamond',serif;font-size:1.05rem;line-height:1.8" data-i18n="home.exp.step3.desc"></p>
    </div>
  </div>
</section>

<!-- REVIEWS -->
<section class="section section-light">
  <div class="section-header fade-up">
    <span class="label" data-i18n="home.reviews.label"></span>
    <div class="h-script" data-i18n="home.reviews.title"></div>
  </div>
  <div class="grid-3">
    <div class="card fade-up" style="background:var(--cream2);border-top:1px solid var(--gold-lt)">
      <div style="font-family:'Cormorant Garamond',serif;font-size:3rem;color:var(--gold-lt);line-height:.6">"</div>
      <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:var(--muted);line-height:1.8;margin:1rem 0" data-i18n="rev1.text"></p>

      <div style="font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.2em;color:var(--text)" data-i18n="rev1.name"></div>
      <div style="font-size:.78rem;color:var(--muted)" data-i18n="rev1.loc"></div>
    </div>
    <div class="card fade-up" style="background:var(--cream2);border-top:1px solid var(--gold-lt)">
      <div style="font-family:'Cormorant Garamond',serif;font-size:3rem;color:var(--gold-lt);line-height:.6">"</div>
      <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:var(--muted);line-height:1.8;margin:1rem 0" data-i18n="rev2.text"></p>
      <div style="color:var(--gold);margin-bottom:.4rem">★★★★★</div>
      <div style="font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.2em;color:var(--text)" data-i18n="rev2.name"></div>
      <div style="font-size:.78rem;color:var(--muted)" data-i18n="rev2.loc"></div>
    </div>
    <div class="card fade-up" style="background:var(--cream2);border-top:1px solid var(--gold-lt)">
      <div style="font-family:'Cormorant Garamond',serif;font-size:3rem;color:var(--gold-lt);line-height:.6">"</div>
      <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:var(--muted);line-height:1.8;margin:1rem 0" data-i18n="rev3.text"></p>
      <div style="color:var(--gold);margin-bottom:.4rem">★★★★★</div>
      <div style="font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.2em;color:var(--text)" data-i18n="rev3.name"></div>
      <div style="font-size:.78rem;color:var(--muted)" data-i18n="rev3.loc"></div>
    </div>
  </div>
</section>

<!-- CTA -->
<section class="section section-dark" style="text-align:center;padding:5rem 2rem">
  <div class="fade-up">
    <span class="label" data-i18n="home.cta.label"></span>
    <div class="h-script" style="font-size:clamp(3rem,6vw,5rem);margin:.4rem 0" data-i18n="home.cta.title"></div>
    <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;color:rgba(255,255,255,.45);margin:1rem 0 2.5rem" data-i18n="home.cta.text"></p>
    <a href="booking.html" class="btn btn-lg" data-i18n="home.cta.btn"></a>
  </div>
</section>

<footer class="footer" id="app-footer"></footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  function renderHomeServices() {
    const grid = document.getElementById('home-services');
    grid.innerHTML = SERVICES.slice(0,3).map(s => `
      <div class="svc-card fade-up">
        <div class="svc-card-img"><span class="h-script">${s['name'+App.cap(App.lang)]}</span></div>
        <div class="svc-card-body">
          <h3>${s['name'+App.cap(App.lang)].toUpperCase()}</h3>
          <div class="price">${App.t('home.from')} ${s.price} $</div>
          <p class="desc">${s['desc'+App.cap(App.lang)]}</p>
          <div class="duration">${s.duration}h · ${App.t('services.hours')}</div>
        </div>
      </div>
    `).join('');
  }
  function onLangChange() { renderHomeServices(); }
  document.addEventListener('DOMContentLoaded', renderHomeServices);
</script>
</body>
</html>
