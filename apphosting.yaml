# Non utilisé si vous déployez uniquement sur Vercel (ce fichier sert à Firebase App Hosting).
# Stack actuelle typique : GitHub → Vercel, Supabase, clé Maps dans Google Cloud.
#
# Carte en production :
# Vercel → votre projet → Settings → Environment Variables
#   - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY  (cochez Production, et Preview si les previews affichent la carte)
#   - NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID   (optionnel, marqueurs avancés)
# Puis déclenchez un nouveau déploiement (les NEXT_PUBLIC_* sont figées au build).
#
# Google Cloud Console → APIs & Services → Credentials :
#   activez « Maps JavaScript API », restreignez la clé par référent HTTP, ex. :
#   https://chezmoici.com/*  https://www.chezmoici.com/*  https://*.vercel.app/*  http://localhost:*

runConfig:
  minInstances: 0
